# Entrance limits
entrance_radius_min = 10 cm
entrance_radius_max = 1.5 m

entrance_phi_min = 0 deg
entrance_phi_max = 360 deg

# Virtual decay region
decay_region_start  = 250 m
decay_region_length = 65 m

decay_region_sigma_x = 14 mm
decay_region_sigma_y = 6 mm

# Particle
particle_momentum_min = 20 GeV
particle_momentum_max = 50 GeV

particle_type = pi+