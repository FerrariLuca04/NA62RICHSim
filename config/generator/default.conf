##########################################################################
#   DEFAULT PARAMETERS FOR PRIMARY GENERATOR                             #
#  --------------------------------------------------------------------  #
#   This is a configuration file for primary particle generation,        #
#   it's suggested to copy this file to recreate a new custom            #
#   config file.                                                         #
#   The complete list of the following keywords with their meanings is   #
